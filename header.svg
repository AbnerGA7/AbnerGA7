<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Abner Gonzales, Analista Programador y Full Stack &amp; Mobile Developer">
  <style>
    .m { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    .p { fill: #61dafb; }
    .d { fill: #7d8590; }
    .t { fill: #e6edf3; }
    .n { fill: #ffffff; font-weight: 700; }
    .a { fill: #61dafb; }
    .g { fill: #3fb950; }
    .o { fill: #f0883e; }
    .r { opacity: 0; animation: in .5s ease forwards; }
    .r1 { animation-delay: .2s } .r2 { animation-delay: .5s } .r3 { animation-delay: .8s }
    .r4 { animation-delay: 1.1s } .r5 { animation-delay: 1.4s } .r6 { animation-delay: 1.7s }
    @keyframes in { to { opacity: 1 } }
    .c { fill: #61dafb; animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .r { opacity: 1; animation: none } .c { animation: none } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a20"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#3a8296"/>
      <stop offset="1" stop-color="#61dafb"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="298" rx="12" fill="url(#bg)" stroke="#1f3a44" stroke-width="2"/>
  <rect x="1" y="1" width="838" height="36" rx="12" fill="#0f2730"/>
  <rect x="1" y="26" width="838" height="11" fill="#0f2730"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="420" y="24" text-anchor="middle" class="m d" font-size="13">abner@lima: ~/portafolio</text>
  <rect x="1" y="36" width="838" height="2" fill="url(#line)" opacity=".7"/>

  <g class="m" font-size="16">
    <text x="28" y="78" class="r r1"><tspan class="p">❯</tspan><tspan class="t"> whoami</tspan></text>
    <text x="28" y="112" class="r r2"><tspan class="n" font-size="30">Abner Gonzales</tspan></text>
    <text x="28" y="146" class="r r3"><tspan class="a">Analista Programador</tspan><tspan class="d"> · </tspan><tspan class="t">Full Stack &amp; Mobile Developer</tspan></text>
    <text x="28" y="182" class="r r4"><tspan class="p">❯</tspan><tspan class="t"> cat stack.txt</tspan></text>
    <text x="28" y="208" class="r r5"><tspan class="o">React</tspan><tspan class="d"> · </tspan><tspan class="o">React Native</tspan><tspan class="d"> · </tspan><tspan class="o">Firebase</tspan><tspan class="d"> · </tspan><tspan class="o">Kotlin</tspan><tspan class="d"> · </tspan><tspan class="o">Flutter</tspan><tspan class="d"> · </tspan><tspan class="o">SQL Server</tspan></text>
    <text x="28" y="244" class="r r6"><tspan class="g">✔</tspan><tspan class="t"> Apps reales para negocios reales</tspan><tspan class="d">  —  Lima, Perú  ·  </tspan><tspan class="a">abnergonzales.dev</tspan></text>
    <text x="28" y="276" class="r r6"><tspan class="p">❯</tspan><tspan class="t"> </tspan><tspan class="c">█</tspan></text>
  </g>
</svg>

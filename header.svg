<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Abner Gonzales, Analista Programador y Full Stack &amp; Mobile Developer">
  <style>
    .sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out .3s forwards; }
    .draw2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease-out .9s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .node { opacity: 0; animation: pop .35s ease-out forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out 2.4s infinite; opacity: 0; }
    @keyframes ring { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25 } }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-10px) } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .node { opacity: 1; animation: none } .draw, .draw2 { stroke-dashoffset: 0; animation: none }
      .ring, .dot, .float { animation: none }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a20"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#3a8296"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".35" r=".6">
      <stop offset="0" stop-color="#61dafb" stop-opacity=".14"/>
      <stop offset="1" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f3a44"/>
    </pattern>
  </defs>

  <!-- Tarjeta -->
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#bg)" stroke="#1f3a44" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#dots)" opacity=".7"/>
  <rect x="1" y="1" width="898" height="318" rx="16" fill="url(#glow)"/>

  <!-- Símbolos flotantes de fondo -->
  <g class="mono float" fill="#61dafb" opacity=".07" font-size="38" font-weight="700">
    <text x="380" y="70">{ }</text>
    <text x="330" y="300">&lt;/&gt;</text>
    <text x="820" y="300">=&gt;</text>
  </g>

  <!-- Lado izquierdo: identidad -->
  <g class="fade" style="animation-delay:.1s">
    <rect x="40" y="40" width="208" height="26" rx="13" fill="#0f2730" stroke="#1f3a44"/>
    <circle class="dot" cx="56" cy="53" r="4.5" fill="#3fb950"/>
    <text x="68" y="57.5" class="mono" font-size="12" fill="#c8e1ff">disponible para freelance</text>
  </g>

  <text x="38" y="122" class="sans fade" font-size="50" font-weight="800" fill="url(#name)" letter-spacing="-1" style="animation-delay:.25s">Abner Gonzales</text>

  <g class="fade" style="animation-delay:.45s">
    <text x="40" y="156" class="sans" font-size="18" font-weight="600"><tspan fill="#61dafb">Analista Programador</tspan><tspan fill="#3a8296">  /  </tspan><tspan fill="#e6edf3">Full Stack &amp; Mobile Dev</tspan></text>
    <text x="40" y="186" class="sans" font-size="14" fill="#8b98a5">Diseño y construyo software que usan negocios reales.</text>
  </g>

  <!-- Chips de stack -->
  <g class="mono fade" font-size="12" style="animation-delay:.65s">
    <rect x="40"  y="208" width="66" height="26" rx="7" fill="#61dafb" fill-opacity=".1" stroke="#61dafb" stroke-opacity=".5"/>
    <text x="73"  y="225" text-anchor="middle" fill="#61dafb">React</text>
    <rect x="114" y="208" width="70" height="26" rx="7" fill="#a97bff" fill-opacity=".1" stroke="#a97bff" stroke-opacity=".5"/>
    <text x="149" y="225" text-anchor="middle" fill="#c3a6ff">Kotlin</text>
    <rect x="192" y="208" width="78" height="26" rx="7" fill="#42a5f5" fill-opacity=".1" stroke="#42a5f5" stroke-opacity=".5"/>
    <text x="231" y="225" text-anchor="middle" fill="#7cc4ff">Flutter</text>
    <rect x="278" y="208" width="86" height="26" rx="7" fill="#ffca28" fill-opacity=".1" stroke="#ffca28" stroke-opacity=".5"/>
    <text x="321" y="225" text-anchor="middle" fill="#ffd95c">Firebase</text>
    <rect x="372" y="208" width="58" height="26" rx="7" fill="#f0883e" fill-opacity=".1" stroke="#f0883e" stroke-opacity=".5"/>
    <text x="401" y="225" text-anchor="middle" fill="#f0a36b">SQL</text>
  </g>

  <g class="fade" style="animation-delay:.85s">
    <path d="M46 262c-4 0-7 3-7 7 0 5 7 12 7 12s7-7 7-12c0-4-3-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="#3a8296"/>
    <text x="60" y="276" class="sans" font-size="13" fill="#8b98a5">Lima, Perú</text>
    <text x="140" y="276" class="sans" font-size="13" fill="#3a8296">·</text>
    <text x="154" y="276" class="mono" font-size="13" fill="#61dafb">abnergonzales.dev</text>
  </g>

  <!-- Separador vertical -->
  <rect x="468" y="40" width="1" height="240" fill="#1f3a44"/>

  <!-- Lado derecho: carrera como git graph -->
  <g class="mono fade" font-size="11" fill="#7d8590" style="animation-delay:.2s">
    <circle cx="500" cy="46" r="3.5" fill="none" stroke="#7d8590" stroke-width="1.6"/>
    <circle cx="518" cy="46" r="3.5" fill="none" stroke="#7d8590" stroke-width="1.6"/>
    <circle cx="500" cy="64" r="3.5" fill="none" stroke="#7d8590" stroke-width="1.6"/>
    <path d="M500 49.5v11M518 49.5c0 6-18 4-18 10" fill="none" stroke="#7d8590" stroke-width="1.6"/>
    <text x="532" y="59">git log --graph  ·  ~/carrera</text>
  </g>

  <!-- Ramas -->
  <path d="M500 288 V96" pathLength="1" class="draw" fill="none" stroke="#61dafb" stroke-width="3" stroke-linecap="round"/>
  <path d="M500 288 C500 268 530 270 530 250 V172 C530 152 500 154 500 134" pathLength="1" class="draw2" fill="none" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>

  <!-- Commits (de abajo hacia arriba) -->
  <g class="sans" font-size="13">
    <circle class="node" cx="500" cy="288" r="7" fill="#0b1a20" stroke="#61dafb" stroke-width="3" style="animation-delay:.4s"/>
    <g class="fade" style="animation-delay:.5s"><text x="552" y="292" class="mono" font-size="11" fill="#7d8590">3b1f0a2</text><text x="612" y="292" fill="#e6edf3"><tspan fill="#61dafb">init:</tspan> Ingeniería de Software · UAP</text></g>

    <circle class="node" cx="530" cy="250" r="7" fill="#0b1a20" stroke="#f0883e" stroke-width="3" style="animation-delay:1.1s"/>
    <g class="fade" style="animation-delay:1.2s"><text x="552" y="254" class="mono" font-size="11" fill="#7d8590">8c4e19d</text><text x="612" y="254" fill="#e6edf3"><tspan fill="#f0883e">feat:</tspan> apps freelance para negocios</text></g>

    <circle class="node" cx="500" cy="211" r="7" fill="#0b1a20" stroke="#61dafb" stroke-width="3" style="animation-delay:1.3s"/>
    <g class="fade" style="animation-delay:1.4s"><text x="552" y="215" class="mono" font-size="11" fill="#7d8590">e52d7b4</text><text x="612" y="215" fill="#e6edf3"><tspan fill="#61dafb">work:</tspan> Soporte de Software @ G&amp;M</text></g>

    <circle class="node" cx="530" cy="172" r="7" fill="#0b1a20" stroke="#f0883e" stroke-width="3" style="animation-delay:1.6s"/>
    <g class="fade" style="animation-delay:1.7s"><text x="552" y="176" class="mono" font-size="11" fill="#7d8590">1fa93c0</text><text x="612" y="176" fill="#e6edf3"><tspan fill="#f0883e">win:</tspan> finalista Autónoma Challenge</text></g>

    <circle class="node" cx="500" cy="134" r="7" fill="#0b1a20" stroke="#61dafb" stroke-width="3" style="animation-delay:1.9s"/>
    <g class="fade" style="animation-delay:2s"><text x="552" y="138" class="mono" font-size="11" fill="#7d8590">6d0b2e8</text><text x="612" y="138" fill="#e6edf3"><tspan fill="#61dafb">merge:</tspan> Analista Programador titulado</text></g>

    <circle class="ring" cx="500" cy="96" r="8" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="node" cx="500" cy="96" r="8" fill="#3fb950" style="animation-delay:2.2s"/>
    <g class="fade" style="animation-delay:2.3s">
      <text x="552" y="100" class="mono" font-size="11" fill="#7d8590">a7f3c9e</text>
      <rect x="610" y="85" width="92" height="20" rx="10" fill="#3fb950" fill-opacity=".15" stroke="#3fb950" stroke-opacity=".6"/>
      <text x="656" y="99" text-anchor="middle" class="mono" font-size="11" fill="#3fb950">HEAD → main</text>
      <text x="710" y="100" fill="#e6edf3">tu próximo proyecto</text>
    </g>
  </g>
</svg>
